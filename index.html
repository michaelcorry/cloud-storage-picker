<!doctype html>
<html lang="en-US">
  <head>
    <title>Cloud Storage Picker</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>Cloud Storage Picker</h1>

    <div class="container">
      <div class="button-group">
        <button id="dropbox">Dropbox</button>
        <button id="google-drive">Google Drive</button>
        <button id="onedrive">OneDrive</button>
        <button id="sharepoint">SharePoint</button>
      </div>

      <div class="divider"></div>

      <div class="result">Please use a picker to select files.</div>
    </div>

    <script type="module">
      import { createPicker, isCancelledError } from "./dist/index.js";
      import { dropboxProvider } from "./dist/providers/dropbox.js";
      import { googleDriveProvider } from "./dist/providers/google-drive.js";
      import { oneDriveProvider } from "./dist/providers/onedrive.js";
      import { sharePointProvider } from "./dist/providers/sharepoint.js";

      const resultDiv = document.querySelector(".result");

      const updateResult = (files) => {
        resultDiv.textContent = JSON.stringify(files, null, 2);
      };

      const openPicker = async (picker) => {
        try {
          const files = await picker.open();
          updateResult(files);
        } catch (error) {
          if (isCancelledError(error)) {
            resultDiv.textContent = "Picker cancelled.";
            return;
          }

          resultDiv.textContent = `Error (${error.code ?? "unknown"}): ${error.message}`;
        }
      };

      const onDropboxChooser = () =>
        openPicker(
          createPicker({
            provider: dropboxProvider({
              appKey: "YOUR_DROPBOX_APP_KEY",
            }),
          }),
        );

      const onGoogleDrivePicker = () =>
        openPicker(
          createPicker({
            provider: googleDriveProvider({
              clientId: "YOUR_GOOGLE_CLIENT_ID",
              apiKey: "YOUR_GOOGLE_API_KEY",
            }),
          }),
        );

      const onOneDrivePicker = () =>
        openPicker(
          createPicker({
            provider: oneDriveProvider({
              clientId: "YOUR_AZURE_CLIENT_ID",
            }),
          }),
        );

      const onSharePointPicker = () =>
        openPicker(
          createPicker({
            provider: sharePointProvider({
              clientId: "YOUR_AZURE_CLIENT_ID",
              baseUrl: "https://YOUR_TENANT.sharepoint.com",
            }),
          }),
        );

      document
        .querySelector("#dropbox")
        .addEventListener("click", onDropboxChooser);

      document
        .querySelector("#google-drive")
        .addEventListener("click", onGoogleDrivePicker);

      document
        .querySelector("#onedrive")
        .addEventListener("click", onOneDrivePicker);

      document
        .querySelector("#sharepoint")
        .addEventListener("click", onSharePointPicker);
    </script>
  </body>
</html>
